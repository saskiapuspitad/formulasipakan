# Sistem Formulasi Pakan — __DOMAIN__
# Berkas ini HANYA mengatur domain __DOMAIN__ (dan www-nya). Situs lain di
# server ini tidak terpengaruh. Dibuat oleh deploy/setup-vps.sh; HTTPS
# ditambahkan certbot ke blok ini saja.
server {
    listen 80;
__IPV6__    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/formulasipakan;
    index index.html;
    client_max_body_size 5m;

    access_log /var/log/nginx/formulasipakan.access.log;
    error_log  /var/log/nginx/formulasipakan.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Selalu dicek ulang agar pembaruan aplikasi cepat sampai ke HP
    location = /sw.js                { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html           { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Berkas hasil build bernama unik -> boleh di-cache lama
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
